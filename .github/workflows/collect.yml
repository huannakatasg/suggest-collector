name: Suggest Collector

on:
  schedule:
    - cron: "30 0 * * *"   # ~07:30 giờ VN mỗi ngày
    - cron: "30 6 * * *"   # ~13:30 giờ VN mỗi ngày
  workflow_dispatch:        # cho phép chạy tay (lần đầu nạp dữ liệu)
    inputs:
      industries:
        description: "Comma-separated industries to collect"
        required: false
        default: "food,realestate,hotel,water,produce"
      delay:
        description: "Delay between suggest requests"
        required: false
        default: "0.6"

concurrency:
  group: suggest-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INDUSTRIES: ${{ github.event.inputs.industries || 'food,realestate,hotel,water,produce' }}
          DELAY: ${{ github.event.inputs.delay || '0.6' }}
        run: python collector.py
