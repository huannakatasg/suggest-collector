name: Suggest Collector

on:
  schedule:
    - cron: "30 0 * * *"   # ~07:30 giờ VN mỗi ngày
    - cron: "30 6 * * *"   # ~13:30 giờ VN mỗi ngày
  workflow_dispatch:        # cho phép chạy tay (lần đầu nạp dữ liệu)

concurrency:
  group: suggest-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INDUSTRIES: "food,realestate,hotel"
          DELAY: "0.6"
        run: python collector.py
